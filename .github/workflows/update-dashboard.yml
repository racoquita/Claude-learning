name: Update economic dashboard

on:
  schedule:
    # Every 30 minutes, all day, Mon-Fri (UTC). GitHub's scheduler is
    # best-effort and silently drops many runs under load (the old 12-runs-a-
    # day schedule was executing ~1-2 times a day), so poll often and let
    # no-op runs exit without committing. Off-peak minutes (:07/:37) are
    # dropped less often than :00.
    - cron: "7,37 * * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest data from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 scripts/fetch_data.py

      - name: Build dashboard
        run: python3 scripts/build_dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refresh economic dashboard data"
          # Rebase in case someone pushed to the branch while this ran.
          git pull --rebase --quiet origin "${GITHUB_REF_NAME}"
          git push
